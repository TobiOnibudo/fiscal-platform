name: Explicit production migration
on:
  workflow_dispatch:
    inputs:
      target:
        description: Confirm production target
        required: true
        type: choice
        options: [production]
permissions:
  contents: read
concurrency:
  group: production-migrations
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.target == 'production'
    environment: production-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install uv==0.13.5
      - run: uv sync --project pipeline --frozen --no-dev
      - run: uv run --project pipeline alembic -c pipeline/alembic.ini upgrade head

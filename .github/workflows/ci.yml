name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install uv==0.13.5
      - run: uv sync --project pipeline --frozen --extra dev --extra extraction
      - working-directory: pipeline
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
          uv run --frozen --extra dev mypy src/fiscal_pipeline
          uv run --frozen --extra dev pytest -m 'not integration'
          uv run --frozen python -m fiscal_pipeline.contracts --check
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: fiscal
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: fiscal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fiscal -d fiscal"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://fiscal:test_only@localhost:5432/fiscal
      TEST_DATABASE_URL: postgresql+psycopg://fiscal:test_only@localhost:5432/fiscal
      DATABASE_URL: postgresql://fiscal:test_only@localhost:5432/fiscal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - run: pip install uv==0.13.5
      - run: uv sync --project pipeline --frozen --extra dev --extra extraction
      - run: uv run --project pipeline alembic -c pipeline/alembic.ini upgrade head
      - run: uv run --project pipeline alembic -c pipeline/alembic.ini check
      - run: uv run --project pipeline pytest pipeline/tests -m integration
      - run: npm ci && npm run db:types:check
  required:
    if: always()
    needs: [web, pipeline, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_VERCEL == 'true'
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Deploy tested commit
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'Deployment enabled but required scoped Vercel credentials are missing.' >&2
            exit 1
          fi
          npx --yes vercel@48.1.6 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@48.1.6 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@48.1.6 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

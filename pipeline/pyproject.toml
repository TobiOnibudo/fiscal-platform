[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscal-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer==0.15.1", "click==8.1.8", "pydantic==2.10.6", "SQLAlchemy==2.0.38", "alembic==1.14.1", "psycopg[binary]==3.2.5", "httpx==0.28.1", "python-dotenv==1.0.1"]

[project.optional-dependencies]
extraction = ["openai==3.37.0", "pdfplumber==0.11.10", "pypdf==6.1.1"]
storage = ["boto3==1.37.16"]
dev = ["pytest==8.3.4", "hypothesis==6.127.2", "ruff==0.9.6", "mypy==1.15.0", "pre-commit==4.1.0"]

[project.scripts]
pipeline = "fiscal_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fiscal_pipeline"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated real Postgres"]

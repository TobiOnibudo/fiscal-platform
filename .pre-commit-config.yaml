default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]
  - repo: local
    hooks:
      - id: eslint
        name: Staged frontend ESLint
        entry: node scripts/lint-staged-web.mjs
        language: system
        files: ^apps/web/.*\.[cm]?[jt]sx?$
      - id: prettier
        name: Staged Prettier
        entry: npm exec -- prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: ^docs/(problem-statement|engineering-design|implementation-plan|local-development|data-sources)\.md$
      - id: conventional-commit
        name: Conventional Commit message
        entry: python scripts/check-commit.py
        language: python
        stages: [commit-msg]

services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: fiscal
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fiscal_db:/var/lib/postgresql/data
      - ./pipeline/docker/init-reader.sql:/docker-entrypoint-initdb.d/reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal -d fiscal"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://fiscal:local_dev_only@db:5432/fiscal
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "-c", "/app/pipeline/alembic.ini"]
    command: ["upgrade", "head"]
  pipeline:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      INGEST_DATABASE_URL: postgresql+psycopg://fiscal:local_dev_only@db:5432/fiscal
      ARCHIVE_DIR: /archive
      INGEST_ENV: local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./archive:/archive
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://fiscal_reader:local_reader@db:5432/fiscal
    depends_on:
      db:
        condition: service_healthy
volumes:
  fiscal_db:
